<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>קדמא — פרסום פרק מקומי</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">כלי מקומי בלבד · לא בפריסה</p>
        <h1>פרסום פרק חדש</h1>
      </div>
      <p id="dryRunBadge" class="badge hidden">DRY RUN</p>
    </header>

    <main class="layout">
      <form id="episodeForm" class="panel">
        <fieldset>
          <legend>מזהים</legend>
          <div class="row">
            <label>מספר פרק <input name="number" id="number" required /></label>
            <label>שנה <input name="year" id="year" required /></label>
            <label>חודש <input name="month" id="month" required pattern="\d{2}" /></label>
            <label>תאריך <input name="date" id="date" type="date" required /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>מטא־דאטה</legend>
          <label>כותרת <input name="title" id="title" required /></label>
          <label>כיתוב לתמונה ראשית <input name="imageCaption" id="imageCaption" /></label>
          <div class="row">
            <label>תקופה (מספר) <input name="period" id="period" type="number" /></label>
            <label>שם תקופה <input name="periodName" id="periodName" /></label>
          </div>
          <label>תגיות (מופרדות בפסיק) <input name="tags" id="tags" /></label>
          <label>משך (מה־MP3) <input name="duration" id="duration" readonly required placeholder="יופיע אחרי העלאת אודיו" /></label>
        </fieldset>

        <fieldset>
          <legend>קבצים</legend>
          <label>אודיו (MP3) <input name="audio" id="audio" type="file" accept="audio/*,.mp3,.m4a" required /></label>
          <label>תמונה ראשית <input name="cover" id="cover" type="file" accept="image/*" required /></label>
          <label>תמונות לגוף הפרק <input name="bodyImages" id="bodyImages" type="file" accept="image/*" multiple /></label>
        </fieldset>

        <fieldset>
          <legend>תוכן Markdown</legend>
          <textarea name="body" id="body" rows="16" required placeholder="הדבק כאן את תוכן הפרק..."></textarea>
        </fieldset>

        <div class="actions">
          <button type="button" id="previewBtn">תצוגה מקדימה</button>
          <button type="button" id="publishBtn" disabled>פרסם</button>
        </div>
        <p id="formStatus" class="status" role="status"></p>
      </form>

      <section class="panel preview" id="previewPanel" hidden>
        <h2>תצוגה מקדימה</h2>
        <article id="previewArticle" class="episode-preview"></article>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
